config-version: 4
# ============================================================
#   EliteMonsters - 主配置文件
#   Purpur 26.x / Paper 1.21.5+
# ============================================================

# 语言切换: zh_CN 或 en_US

# 调试模式 (true=输出详细日志到控制台)
debug: false

locale: zh_CN

# ============================================================
#   精英怪生成配置
# ============================================================
generation:
  # 基础生成概率 (0.0 ~ 1.0)
  # 全局属性倍率 (0.1~1.0, 默认0.5, 1.0=原始强度)
  global-attribute-scale: 0.5

  base-chance: 0.05

  # 动态难度: 根据附近玩家装备自动调整星级 (true=启用)
  dynamic-difficulty: false

  # 禁用精英怪生成的世界列表
  world-blacklist: ["world_nether"]

  # 每区块最大精英怪数量 (-1=不限制, 建议2~5)
  max-per-chunk: 3

  # 是否启用白名单模式 (true=仅白名单生物可成为精英怪)
  use-whitelist: false

  # 白名单生物 (仅当 use-whitelist=true 时生效)
  whitelist: [ZOMBIE, SKELETON]

  # 黑名单生物 (这些生物永远不会成为精英怪)
  blacklist: [VILLAGER, BAT, SLIME, MAGMA_CUBE]

  # 生成条件乘数 (影响最终概率 = base-chance * 各条件乘数)
  conditions:
    # 高度条件 (Y坐标)
    height:
      below_0: 1.5     # Y<0 时概率乘数
      below_32: 1.3    # Y<32
      below_64: 1.0    # Y<64 (基准)
      above_128: 2.0   # Y>128 高海拔概率翻倍

    # 生物群系概率乘数
    biome:
      SOUL_SAND_VALLEY: 1.8  # 灵魂沙谷
      DEEP_DARK: 2.5         # 深暗之域 (最高)
      SWAMP: 1.4             # 沼泽
      FOREST: 1.0            # 森林 (基准)

    # 时间条件乘数
    time:
      FULL_MOON: 2.0    # 满月
      BLOOD_MOON: 3.0   # 血月
      NIGHT: 1.5        # 夜晚
      DAY: 0.5          # 白天 (概率减半)

    # 难度条件乘数
    difficulty:
      PEACEFUL: 0.0     # 和平 (不生成)
      EASY: 0.5         # 简单
      NORMAL: 1.0       # 普通
      HARD: 2.0         # 困难

# ============================================================
#   生成特效配置
# ============================================================
spawn-effects:
  # 生成时是否劈闪电
  lightning: true
  # 是否播放闪电声音
  lightning-sound: true
  # 是否全服提醒
  global-alert: true
  # 提醒范围 (格)
  alert-range: 50
  # 提醒消息 (可留空使用 lang.yml)
  alert-message: ""

# ============================================================
#   星级系统
# ============================================================
star-system:
  # 最高等级 (1-5)
  max-level: 5

  # 星级符号 (用于怪物名字前缀)
  star-char: "\u2605"        # 实心星 ★
  empty-star-char: "\u2606"  # 空心星 ☆

  # 各等级配置
  levels:
    1:
      attribute-multiplier: 1.5   # 属性倍率
      skill-count: 1              # 技能数量
      armor-tier: LEATHER          # 护甲材质 (LEATHER/CHAINMAIL/IRON/DIAMOND/NETHERITE)
    2:
      attribute-multiplier: 2.0
      skill-count: 2
      armor-tier: CHAINMAIL
    3:
      attribute-multiplier: 2.5
      skill-count: 3
      armor-tier: IRON
    4:
      attribute-multiplier: 3.0
      skill-count: 4
      armor-tier: DIAMOND
    5:
      attribute-multiplier: 4.0
      skill-count: 5
      armor-tier: NETHERITE

# ============================================================
#   词缀配置
#   每个词缀可自定义: 名称/颜色/前缀/属性/技能/粒子/音效
# ============================================================
affixes:
  FRENZY:
    name: "狂战士"        # 词缀名称
    color: "&c"             # 颜色代码
    prefix: "&c&l[%stars%%name%]"  # 名字前缀模板 (%stars%=星星, %name%=词缀名+生物名)
    attributes:
      health-multiplier: 1.3
      damage-multiplier: 1.5
      speed-multiplier: 1.0
      armor: 0.0
      knockback-resistance: 0.3
    skills: [FRENZY_ENRAGE]
    particles:
      - type: ANGRY_VILLAGER
        count: 1
        offset: 0.5
    sounds:
      spawn: ENTITY_WOLF_GROWL
      hit: ENTITY_PLAYER_ATTACK_CRIT
      death: ENTITY_WOLF_DEATH

  SWIFT:
    name: "疾风剑豪"
    color: "&b"
    prefix: "&b&l[%stars%%name%]"
    attributes:
      health-multiplier: 1.0
      damage-multiplier: 1.1
      speed-multiplier: 1.6
      armor: 0.0
      knockback-resistance: 0.0
    skills: [SWIFT_DASH]
    particles:
      - type: CLOUD
        count: 3
        offset: 0.3
    sounds:
      spawn: ENTITY_PLAYER_ATTACK_SWEEP
      hit: ENTITY_PLAYER_ATTACK_KNOCKBACK
      death: ENTITY_PLAYER_BIG_FALL

  VAMPIRIC:
    name: "吸血伯爵"
    color: "&4"
    prefix: "&4&l[%stars%%name%]"
    attributes:
      health-multiplier: 1.4
      damage-multiplier: 1.2
      speed-multiplier: 1.0
      armor: 0.0
      knockback-resistance: 0.2
    skills: [VAMPIRIC_LIFESTEAL]
    particles:
      - type: DAMAGE_INDICATOR
        count: 3
        offset: 0.5
    sounds:
      spawn: ENTITY_WITCH_AMBIENT
      hit: ENTITY_ARROW_HIT_PLAYER
      death: ENTITY_WITCH_DEATH

  FLAMING:
    name: "炎魔"
    color: "&6"
    prefix: "&6&l[%stars%%name%]"
    attributes:
      health-multiplier: 1.2
      damage-multiplier: 1.3
      speed-multiplier: 1.1
      armor: 0.0
      knockback-resistance: 0.1
    skills: [FLAMING_INFERNO]
    particles:
      - type: FLAME
        count: 5
        offset: 0.3
    sounds:
      spawn: ENTITY_BLAZE_SHOOT
      hit: ENTITY_GENERIC_BURN
      death: ENTITY_BLAZE_DEATH

  FREEZING:
    name: "凋零之王"
    color: "&f"
    prefix: "&f&l[%stars%%name%]"
    attributes:
      health-multiplier: 1.3
      damage-multiplier: 1.2
      speed-multiplier: 0.8
      armor: 0.0
      knockback-resistance: 0.3
    skills: [FREEZING_FROST]
    particles:
      - type: SNOWFLAKE
        count: 3
        offset: 0.5
    sounds:
      spawn: BLOCK_SNOW_STEP
      hit: BLOCK_GLASS_BREAK
      death: ENTITY_SKELETON_DEATH

  EXPLOSIVE:
    name: "爆破鬼才"
    color: "&e"
    prefix: "&e&l[%stars%%name%]"
    attributes:
      health-multiplier: 1.0
      damage-multiplier: 1.8
      speed-multiplier: 1.0
      armor: 0.0
      knockback-resistance: 0.0
    skills: [EXPLOSIVE_BLAST]
    particles:
      - type: LAVA
        count: 2
        offset: 0.3
    sounds:
      spawn: ENTITY_CREEPER_PRIMED
      hit: ENTITY_GENERIC_EXPLODE
      death: ENTITY_CREEPER_DEATH

  SHIELDED:
    name: "不灭之盾"
    color: "&7"
    prefix: "&7&l[%stars%%name%]"
    attributes:
      health-multiplier: 1.5
      damage-multiplier: 0.8
      speed-multiplier: 0.7
      armor: 5.0
      knockback-resistance: 0.8
    skills: [SHIELDED_BARRIER]
    particles:
      - type: ENCHANT
        count: 5
        offset: 0.5
    sounds:
      spawn: BLOCK_ANVIL_PLACE
      hit: BLOCK_ANVIL_HIT
      death: BLOCK_ANVIL_DESTROY

  INVISIBLE:
    name: "暗影刺客"
    color: "&3"
    prefix: "&3&l[%stars%%name%]"
    attributes:
      health-multiplier: 0.9
      damage-multiplier: 1.4
      speed-multiplier: 1.2
      armor: 0.0
      knockback-resistance: 0.0
    skills: [INVISIBLE_CLOAK]
    particles:
      - type: PORTAL
        count: 3
        offset: 0.4
    sounds:
      spawn: ENTITY_ILLUSIONER_MIRROR_MOVE
      hit: ENTITY_ILLUSIONER_HURT
      death: ENTITY_ILLUSIONER_DEATH

  REGENERATING:
    name: "不死之身"
    color: "&d"
    prefix: "&d&l[%stars%%name%]"
    attributes:
      health-multiplier: 1.5
      damage-multiplier: 1.0
      speed-multiplier: 1.0
      armor: 0.0
      knockback-resistance: 0.2
    skills: [REGENERATING_HEAL]
    particles:
      - type: HEART
        count: 2
        offset: 0.5
    sounds:
      spawn: BLOCK_BREWING_STAND_BREW
      hit: ENTITY_PLAYER_HURT_SWEET_BERRY_BUSH
      death: BLOCK_BREWING_STAND_BREW

  SUMMONING:
    name: "亡灵术士"
    color: "&5"
    prefix: "&5&l[%stars%%name%]"
    attributes:
      health-multiplier: 1.1
      damage-multiplier: 0.8
      speed-multiplier: 1.0
      armor: 0.0
      knockback-resistance: 0.1
    skills: [SUMMONING_MINIONS]
    particles:
      - type: WITCH
        count: 10
        offset: 0.5
    sounds:
      spawn: ENTITY_EVOKER_PREPARE_SUMMON
      hit: ENTITY_EVOKER_HURT
      death: ENTITY_EVOKER_DEATH

  CHAINING:
    name: "锁魂之链"
    color: "&9"
    prefix: "&9&l[%stars%%name%]"
    attributes:
      health-multiplier: 1.2
      damage-multiplier: 1.2
      speed-multiplier: 1.1
      armor: 0.0
      knockback-resistance: 0.1
    skills: [CHAINING_PULL, CHAINING_HATRED]
    particles:
      - type: ELECTRIC_SPARK
        count: 4
        offset: 0.5
    sounds:
      spawn: ENTITY_LIGHTNING_BOLT_THUNDER
      hit: ENTITY_LIGHTNING_BOLT_IMPACT
      death: ENTITY_LIGHTNING_BOLT_THUNDER

# ============================================================
#   视觉配置
# ============================================================
visual:
  # 粒子密度: low(低配) / medium(中配) / high(高配)
  particle-density: high
  # 是否在怪物头顶显示名字
  display-name-above: true
  # 是否显示血量条
  health-bar-above: true
  # 血量条格式
  health-bar-format: "&c{current}/{max}"

# ============================================================
#   尸潮配置
# ============================================================
horde:
  # 是否启用尸潮
  enabled: true

  # 尸潮中心点模式: random_player(随机玩家) / world_spawn(世界出生点)
  center-mode: random_player

  # 最小在线玩家数 (低于此数不触发)
  min-players: 1

  # 自动尸潮间隔 (秒, 7200=2小时)
  auto-interval: 7200

  # 夜晚随机尸潮概率 (每夜检查一次)
  random-chance: 0.15

  # 生成半径配置 (以目标玩家为中心)
  # 怪物会在 spawn-min-radius ~ spawn-radius 的环形区域内生成
  spawn-radius: 15.0       # 最远生成距离
  spawn-min-radius: 8.0    # 最近生成距离

  # 尸潮怪物高亮 (发亮效果, 方便玩家寻找)
  glow-mobs: true

  # 波次间隔 (秒)
  wave-interval: 15

  # 波次配置
  # rewards 字段支持两种格式:
  #   新格式 (推荐): rewards: ["wave1_default", "my_custom_reward"]  引用 rewards.yml 中的奖励ID
  #   旧格式 (兼容): rewards.money / rewards.xp / rewards.items / rewards.commands  直接配置
  waves:
    1:
      mob-count: 10        # 怪物数量
      mob-types: [ZOMBIE, SKELETON]  # 怪物类型
      elite-chance: 0.0    # 精英怪概率
      wave-timeout: 300    # 波次超时秒数 (0=不限时, 超时尸潮失败)
      rewards: ["wave1_default"]
    2:
      mob-count: 15
      mob-types: [ZOMBIE, SKELETON, SPIDER]
      elite-chance: 0.1
      wave-timeout: 300
      rewards: ["wave2_default"]
    3:
      mob-count: 20
      mob-types: [ZOMBIE, SKELETON, SPIDER, CREEPER]
      elite-chance: 0.2
      wave-timeout: 300
      rewards: ["wave3_default"]
    4:
      mob-count: 25
      mob-types: [ZOMBIE, SKELETON, SPIDER, CREEPER, WITCH]
      elite-chance: 0.3
      wave-timeout: 300
      rewards: ["wave4_default"]
    5:
      mob-count: 30
      mob-types: [ZOMBIE, SKELETON, SPIDER, CREEPER, WITCH]
      elite-chance: 0.4
      wave-timeout: 300
      boss: true           # 是否生成Boss
      rewards: ["wave5_default"]

  # 全局奖励 (所有参与玩家)
  global-rewards:
    enabled: true
    money-per-wave: 0
    xp-per-wave: 0
    # rewards: 引用 rewards.yml 中的奖励ID，在尸潮完成后发放给所有参与玩家
    rewards: []
    completion-commands:
      - "broadcast &6[Horde] &e%players% 成功抵御了 %waves% 波尸潮!"
