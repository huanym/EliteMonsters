# config-version: 1
# ============================================================
#   EliteMonsters - 奖励配置文件
#   Purpur 26.x / Paper 1.21.5+
# ============================================================
#
# 奖励类型说明:
#   ITEM       - 物品奖励 (名称/Lore/附魔/CustomModelData/头颅纹理)
#   EXP        - 经验值或等级 (支持范围随机)
#   VAULT      - 游戏币 (依赖 Vault)
#   COMMAND    - 控制台执行指令 (占位符: {player} {x} {y} {z})
#   PERMISSION - LuckPerms 权限/称号 (支持限时或永久)
#   GROUP      - 组合奖励 (包含多个子奖励, 可递归嵌套)
#
# 通用字段:
#   chance: 0.0~1.0 (概率, 默认1.0=必定发放)
# ============================================================

rewards:
  wave1_default:
    type: GROUP
    children:
      - type: VAULT
        amount: 100.0
      - type: EXP
        amount: 50
        is-levels: false
      - type: ITEM
        material: BONE
        amount: 5
      - type: ITEM
        material: ROTTEN_FLESH
        amount: 5

  wave2_default:
    type: GROUP
    children:
      - type: VAULT
        amount: 200.0
      - type: EXP
        amount: 80
      - type: ITEM
        material: IRON_INGOT
        amount: 3
      - type: ITEM
        material: BONE
        amount: 8

  wave3_default:
    type: GROUP
    children:
      - type: VAULT
        amount: 350.0
      - type: EXP
        amount: 120
      - type: ITEM
        material: DIAMOND
        amount: 1
      - type: ITEM
        material: IRON_INGOT
        amount: 5

  wave4_default:
