        amount: 200
      - type: ITEM
        material: DIAMOND
        amount: 3
      - type: ITEM
        material: EMERALD
        amount: 5

  wave5_default:
    type: GROUP
    children:
      - type: VAULT
        amount: 1000.0
      - type: EXP
        amount: 500
      - type: ITEM
        material: DIAMOND
        amount: 5
      - type: ITEM
        material: EMERALD
        amount: 10
      - type: ITEM
        material: NETHERITE_INGOT
        amount: 1
      - type: ITEM
        material: ENCHANTED_GOLDEN_APPLE
        amount: 1

  example_custom_item:
    type: ITEM
    material: DIAMOND_SWORD
    amount: 1
    name: "&6尸潮克星"
    lore:
      - "&7击败尸潮获得的奖励"
      - "&e+5 攻击伤害"
    enchantments:
      SHARPNESS: 5
      UNBREAKING: 3
    custom_model_data: 10001

  example_skull:
    type: ITEM
    material: PLAYER_HEAD
    amount: 1
    skull_texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUv..."
    name: "&6Boss头颅"

  example_exp_levels:
    type: EXP
    min-amount: 5
    max-amount: 10
    is-levels: true

  example_command:
    type: COMMAND
    commands:
      - "give {player} diamond 1"
      - "broadcast &e{player} 获得了尸潮奖励!"

  example_permission:
    type: PERMISSION
    permission: "elitemonsters.vip"
    duration: "7d"

  example_permission_permanent:
    type: PERMISSION
    permission: "elitemonsters.champion"

  example_chance:
    type: ITEM
    material: NETHER_STAR
    amount: 1
    chance: 0.1
    name: "&d稀有掉落"
